config:
  default: true
  MD013: false
  MD033: false
  MD040: false
  MD041: false
  MD060: false
  # A "+" starting a wrapped line would otherwise read as a list marker.
  MD004: false
  MD024:
    siblings_only: true
globs:
  - "**/*.md"
  - "!**/node_modules/**"
  - "!**/build*/**"
  - "!**/.git/**"
  - "!**/_deps/**"
  - "!**/vendor/**"
  - "!**/.venv/**"
  - "!**/*.egg-info/**"
