name: Bug report
description: A crash, a wrong result, or a build failure.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what you got, and any error message or backtrace.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code or steps that show the problem.
      placeholder: |
        1. make build
        2. ./build/examples/example_arcgis
        3. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - spc-cpp: v0.4.1 (or commit)
        - OS: Ubuntu 24.04 / macOS 26
        - Compiler: GCC 13.3 / Clang 18 / Apple Clang 17
        - libcurl: 8.5.0
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Report security vulnerabilities privately, as described in the [security policy](https://github.com/Reddimus/spc-cpp/security/policy).
