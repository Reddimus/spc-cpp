name: Bug report
description: A crash, a wrong result, or a build failure.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report security vulnerabilities through GitHub's private vulnerability reporting, as described in the [security policy](https://github.com/Reddimus/spc-cpp/security/policy), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what you got, and any error message or backtrace.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code or steps that show the problem.
      placeholder: |
        1. make build
        2. ./build/examples/example_arcgis
        3. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - spc-cpp: vX.Y.Z or commit
        - OS: Ubuntu 24.04 / macOS 15+ / Windows 11
        - Compiler: GCC 13+ / Clang 18+ / Apple Clang 17+ / MSVC
        - libcurl: 8.5.0
    validations:
      required: true
