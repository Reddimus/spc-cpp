name: Feature request
description: A new product, API, or developer-experience improvement.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: The API or behavior you want, and the code it would let you write.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today?
      description: Workarounds you use now, if any.
  - type: textarea
    id: context
    attributes:
      label: Links
      description: NOAA or IEM documentation, related issues, or examples.
