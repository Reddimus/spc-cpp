name: Release

# Pushing a vX.Y.Z tag publishes a GitHub Release whose notes are the matching
# "## [X.Y.Z]" section of CHANGELOG.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches project(spc-cpp VERSION ...)
        # find_package(spc X.Y) compares against PROJECT_VERSION, so the two
        # must agree.
        run: |
          version="${GITHUB_REF_NAME#v}"
          cmake_version=$(sed -nE 's/^project\(spc-cpp VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "$cmake_version" != "${version%%-*}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt version $cmake_version"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libcurl4-openssl-dev locales
          sudo locale-gen de_DE.UTF-8

      - name: Build and test
        run: make test CMAKE_ARGS=-DSPC_WARNINGS_AS_ERRORS=ON

      - name: Check installed and FetchContent consumers
        run: ./tools/test_consumers.sh

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract the release notes
        # Write to a file: echoing the notes through the shell would run their
        # `code` spans as command substitutions.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## / { exit }
            capture && /^\[[^]]+\]: / { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
