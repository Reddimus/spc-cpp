name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. The workflow runs on pull_request, and
# consumer-smoke plus the FetchContent builds clone and execute third-party
# code, so no job should inherit a writable token. A job that needs more grants
# itself a narrower block.
permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang-format \
            libcurl4-openssl-dev

      - name: Build
        run: make build CMAKE_ARGS=-DSPC_WARNINGS_AS_ERRORS=ON

      - name: Test
        run: make test

      - name: Verify fixture provenance
        run: make fixtures-check

      - name: Lint
        run: make lint

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          brew install pkg-config curl clang-format
          echo "CMAKE_PREFIX_PATH=$(brew --prefix curl)" >> "$GITHUB_ENV"

      - name: Build
        run: make build CMAKE_ARGS=-DSPC_WARNINGS_AS_ERRORS=ON

      - name: Test
        run: make test

      - name: Lint
        run: make lint

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libcurl4-openssl-dev
      - name: Build with address and undefined behavior sanitizers
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DSPC_ENABLE_LTO=OFF
          -DSPC_ENABLE_SANITIZERS=ON
          -DSPC_BUILD_EXAMPLES=OFF
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libcurl4-openssl-dev
      - name: Build with ThreadSanitizer
        run: >-
          cmake -S . -B build-thread-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DSPC_ENABLE_LTO=OFF
          -DSPC_ENABLE_THREAD_SANITIZER=ON
          -DSPC_BUILD_EXAMPLES=OFF
      - run: cmake --build build-thread-sanitized --parallel
      - run: ctest --test-dir build-thread-sanitized --output-on-failure

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 clang-tidy-18 cmake \
            libc++-18-dev libc++abi-18-dev libcurl4-openssl-dev
      - name: Run clang-tidy while compiling
        run: >-
          cmake -S . -B build-tidy
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DSPC_ENABLE_CLANG_TIDY=ON
          -DSPC_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-18
          -DSPC_ENABLE_LTO=OFF
          -DSPC_BUILD_TESTS=OFF
          -DSPC_BUILD_EXAMPLES=OFF
      - run: cmake --build build-tidy --parallel

  consumer-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libcurl4-openssl-dev
      - run: ./tools/test_consumers.sh
