name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jobs build third-party code fetched at configure time, so none of them gets a
# writable token. They use the runner image's CMake; Ubuntu's packaged 3.28 is
# older than the 3.31 Glaze requires.
permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-format libcurl4-openssl-dev locales
          # The locale tests skip without a comma-decimal locale.
          sudo locale-gen de_DE.UTF-8
      - name: Build
        run: >-
          make build CMAKE_ARGS="-DSPC_WARNINGS_AS_ERRORS=ON
          -DSPC_BUILD_BENCHMARKS=ON"
      - name: Test
        run: make test
      # One iteration each: it fails when a benchmark reports an error, never
      # on timing.
      - name: Run each benchmark once
        run: build/benchmarks/spc_benchmarks --benchmark_dry_run=true
      - name: Verify fixture checksums
        run: make fixtures-check
      - name: Lint
        run: make lint

  # Clang 18 with libc++ 18, the oldest toolchain the README supports.
  build-linux-libcxx:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 libc++-18-dev libc++abi-18-dev \
            libcurl4-openssl-dev locales
          sudo locale-gen de_DE.UTF-8
      - name: Build
        run: >-
          make build CMAKE_ARGS="-DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DSPC_WARNINGS_AS_ERRORS=ON"
      - name: Test
        run: make test

  # The README build on a Mac: Apple Clang and the system libcurl. One
  # universal binary targeting macOS 13.4 covers both architectures, and
  # test-macos runs it on an older macOS and a real Intel Mac.
  build-macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build for arm64 and x86_64, macOS 13.4 and later
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSPC_WARNINGS_AS_ERRORS=ON
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.4 "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - run: cmake --build build --parallel
      - name: Check both slices, the minimum macOS, and the system libcurl
        run: |
          for f in build/src/libspc_*.a build/tests/spc_tests; do
            lipo "$f" -verify_arch arm64 && lipo "$f" -verify_arch x86_64
          done
          otool -l build/tests/spc_tests | grep -q 'minos 13.4'
          otool -L build/tests/spc_tests | grep -q /usr/lib/libcurl.4.dylib
      - name: Test the arm64 slice
        run: ctest --test-dir build --output-on-failure
      - name: Test the x86_64 slice under Rosetta 2
        run: arch -x86_64 build/tests/spc_tests
      - name: Check installed and FetchContent consumers
        run: ./tools/test_consumers.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal
          path: |
            build/tests/spc_tests
            build/examples/example_parse_outlook

  # Runs the macOS 13.4 build from build-macos on an older macOS and on a real
  # Intel Mac. The tests read fixtures from the same absolute checkout path.
  test-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-universal
          path: build
      - name: Test
        run: |
          chmod +x build/tests/spc_tests build/examples/example_parse_outlook
          sw_vers -productVersion && uname -m
          build/tests/spc_tests
          build/examples/example_parse_outlook

  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libcurl4-openssl-dev locales
          sudo locale-gen de_DE.UTF-8
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug
          -DSPC_ENABLE_SANITIZERS=ON -DSPC_BUILD_EXAMPLES=OFF
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libcurl4-openssl-dev locales
          sudo locale-gen de_DE.UTF-8
      - name: Build with ThreadSanitizer
        run: >-
          cmake -S . -B build-thread-sanitized -DCMAKE_BUILD_TYPE=Debug
          -DSPC_ENABLE_THREAD_SANITIZER=ON -DSPC_BUILD_EXAMPLES=OFF
      - run: cmake --build build-thread-sanitized --parallel
      - run: ctest --test-dir build-thread-sanitized --output-on-failure

  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 clang-tidy-18 \
            libc++-18-dev libc++abi-18-dev libcurl4-openssl-dev
      - name: Compile the libraries with clang-tidy
        run: >-
          make tidy CMAKE_ARGS="-DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DSPC_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-18"

  consumer-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libcurl4-openssl-dev
      - run: ./tools/test_consumers.sh
